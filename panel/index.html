<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Docker Logs</title>
    <style>
      :root {
        --ansi-0: #3b3b3b; --ansi-1: #c4302b; --ansi-2: #2f8a3b; --ansi-3: #9a6a00;
        --ansi-4: #2b5fc4; --ansi-5: #a03ab3; --ansi-6: #16808a; --ansi-7: #6e6e6e;
        --ansi-8: #5e5e5e; --ansi-9: #e0443e; --ansi-10: #3aa64a; --ansi-11: #b88300;
        --ansi-12: #3d74e0; --ansi-13: #bf4fd1; --ansi-14: #1c9ba6; --ansi-15: #2a2a2a;
        --ok: #2f9e44; --warn: #c27c00; --bad: var(--orca-destructive, #d9363e);
        --radius: var(--orca-radius, 6px);
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      html.dark {
        --ansi-0: #4d4d4d; --ansi-1: #f2635c; --ansi-2: #5cc26b; --ansi-3: #e3b341;
        --ansi-4: #5c9dff; --ansi-5: #d07ae0; --ansi-6: #3fc1cc; --ansi-7: #c8c8c8;
        --ansi-8: #8a8a8a; --ansi-9: #ff8079; --ansi-10: #7be08a; --ansi-11: #ffd36b;
        --ansi-12: #8ab8ff; --ansi-13: #e9a1f5; --ansi-14: #74e3eb; --ansi-15: #f2f2f2;
        --ok: #51cf66; --warn: #fcc419;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        font: 12px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: var(--orca-foreground);
        background: var(--orca-background);
      }
      button, select, input { font: inherit; color: inherit; }
      button, select, input[type='search'], #view-name {
        border: 1px solid var(--orca-input, var(--orca-border));
        border-radius: var(--radius);
        background: var(--orca-background);
        padding: 2px 8px;
        min-height: 24px;
      }
      button {
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        background: var(--orca-secondary);
        color: var(--orca-secondary-foreground);
        white-space: nowrap;
      }
      button:hover:not(:disabled) { background: var(--orca-accent); color: var(--orca-accent-foreground); }
      button:disabled { opacity: 0.45; cursor: default; }
      button.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
      :focus-visible { outline: 2px solid var(--orca-ring); outline-offset: 1px; }
      [hidden] { display: none !important; }
      .icon-svg { width: 14px; height: 14px; flex: none; }

      .toolbar { display: flex; flex-direction: column; gap: 6px; padding: 8px; border-bottom: 1px solid var(--orca-border); }
      .toolbar-row { display: flex; gap: 6px; align-items: center; }
      .toolbar select { flex: 1; min-width: 0; }
      .square { width: 26px; padding: 0; flex: none; }
      .project-actions { display: flex; gap: 4px; flex-wrap: wrap; }
      .project-actions button { flex: 1; }

      .notice {
        margin: 8px 8px 0;
        padding: 6px 8px;
        border-radius: var(--radius);
        background: var(--orca-muted);
        color: var(--orca-muted-foreground);
        white-space: pre-wrap;
        word-break: break-word;
      }
      .notice.error { color: var(--bad); }

      .services {
        list-style: none;
        margin: 0;
        padding: 4px;
        max-height: 60%;
        overflow-y: auto;
        flex: none;
        border-bottom: 1px solid var(--orca-border);
      }
      .services:empty { display: none; }
      .docker-context { color: var(--orca-muted-foreground); font-size: 11px; overflow-wrap: anywhere; }
      .compose-settings summary, .diagnostics summary { cursor: pointer; padding: 3px 0; }
      .compose-settings form { display: grid; gap: 6px; padding: 6px 0; }
      .compose-settings label { display: grid; gap: 3px; white-space: normal; }
      .compose-settings textarea, .compose-settings input { width: 100%; min-width: 0; background: var(--orca-background); color: inherit; border: 1px solid var(--orca-border); border-radius: var(--radius); padding: 4px; }
      .compose-settings textarea { resize: vertical; min-height: 45px; font-family: var(--mono); }
      .hint { color: var(--orca-muted-foreground); font-size: 11px; white-space: normal; }
      .services-resize { flex: none; height: 7px; cursor: row-resize; border-bottom: 1px solid var(--orca-border); }
      .services-resize:hover, .services-resize:focus-visible { background: var(--orca-accent); }
      .diagnostics { margin: 0 8px; flex: none; font-size: 11px; max-height: 150px; overflow: auto; }
      .diagnostics.has-problem > summary { color: var(--bad); }
      .diagnostics pre { margin: 4px 0 8px; font: 11px/1.4 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
      .repeat-count { font-weight: 700; color: var(--warn); }
      .json-fields { margin: 2px 0; white-space: normal; font-family: var(--mono); }
      .json-fields dl { display: grid; grid-template-columns: minmax(70px, auto) minmax(0, 1fr); gap: 2px 8px; margin: 4px 0; }
      .json-fields dt { opacity: .7; overflow-wrap: anywhere; }
      .json-fields dd { margin: 0; overflow-wrap: anywhere; }
      .log-warning { color: var(--warn); }
      mark.search-hit { background: #e3b34155; color: inherit; border-radius: 2px; }
      mark.current-match { background: #e3b341; color: #181818; outline: 1px solid currentColor; }
      .current-error { outline: 1px solid var(--bad); outline-offset: -1px; }
      .search-count { flex: none; min-width: 35px; font-variant-numeric: tabular-nums; }
      .activity { margin: 0 8px; flex: 0 1 auto; min-height: 24px; max-height: 180px; overflow: auto; }
      .activity > summary { cursor: pointer; padding: 3px 0; }
      .operation { padding: 5px 0; border-bottom: 1px solid var(--orca-border); }
      .operation-status { margin-left: auto; font-size: 11px; }
      .operation-running .operation-status { color: var(--warn); }
      .operation-failed .operation-status { color: var(--bad); }
      .operation-succeeded .operation-status { color: var(--ok); }
      .operation pre { white-space: pre-wrap; overflow-wrap: anywhere; font: 11px/1.4 var(--mono); }
      .operation summary { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--orca-muted-foreground); cursor: pointer; }
      .service { display: flex; align-items: center; gap: 6px; padding-right: 4px; border-radius: var(--radius); }
      .service.selected { background: var(--orca-accent); color: var(--orca-accent-foreground); }
      .service:not(.selected):hover { background: var(--orca-muted); }
      .pick {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 7px;
        border: 0;
        background: transparent;
        color: inherit;
        text-align: left;
        padding: 3px 4px 3px 6px;
      }
      .pick:hover:not(:disabled) { background: transparent; color: inherit; }
      .text { display: flex; flex-direction: column; min-width: 0; line-height: 1.3; }
      .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .status { font-size: 11px; color: var(--orca-muted-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .selected .status, .selected .usage { color: inherit; opacity: 0.75; }
      .status.bad { color: var(--bad); }
      .selected .status.bad { opacity: 1; }
      .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--orca-muted-foreground); }
      .dot.ok { background: var(--ok); }
      .dot.warn { background: var(--warn); }
      .dot.bad { background: var(--bad); }
      .dot.off { opacity: 0.5; }
      .dot.none { background: transparent; border: 1px solid var(--orca-muted-foreground); }
      .all-icon { width: 12px; height: 12px; flex: none; opacity: 0.8; }
      .side { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; flex: none; }
      .usage-row { display: inline-flex; align-items: center; gap: 6px; }
      .spark { width: 46px; height: 14px; flex: none; overflow: visible; }
      .spark polyline { fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .spark-cpu { stroke: var(--orca-primary); stroke-width: 1.4; }
      .spark-mem { stroke: var(--ansi-5); stroke-width: 1; stroke-dasharray: 2 1.6; opacity: 0.75; }
      .selected .spark-cpu, .selected .spark-mem { stroke: currentColor; }
      .usage { color: var(--orca-muted-foreground); font: 11px var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
      .ports { display: flex; gap: 4px; }
      .port {
        border: 0;
        background: none;
        padding: 0;
        min-height: 0;
        font: 11px var(--mono);
        color: var(--orca-primary);
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      .port:hover:not(:disabled) { background: none; color: var(--orca-primary); }
      .selected .port { color: inherit; }
      .actions { display: flex; gap: 1px; flex: none; }
      .actions button { width: 24px; min-height: 24px; padding: 0; background: transparent; border-color: transparent; color: inherit; }
      .actions button:hover:not(:disabled) { border-color: var(--orca-border); }

      .logbar { display: flex; flex-direction: column; gap: 6px; padding: 8px; flex: none; }
      .row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
      .log-title { flex: 1; min-width: 60px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .row input[type='search'] { flex: 1 1 120px; min-width: 0; }
      .row select { flex: 1 1 110px; min-width: 0; }
      label { display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; cursor: pointer; }
      .cleared { color: var(--orca-muted-foreground); }
      .link { border: 0; background: none; padding: 0; min-height: 0; color: var(--orca-primary); text-decoration: underline; }
      .link:hover:not(:disabled) { background: none; color: var(--orca-primary); }

      .log {
        flex: 1;
        min-height: 0;
        overflow: auto;
        margin: 0 8px 8px;
        padding: 6px 0;
        border: 1px solid var(--orca-border);
        border-radius: var(--radius);
        background: var(--orca-card);
        color: var(--orca-card-foreground);
        font: 11.5px/1.45 var(--mono);
        white-space: pre;
      }
      .log.wrap { white-space: pre-wrap; word-break: break-word; }
      .line { padding: 0 8px 0 6px; border-left: 2px solid transparent; }
      /* Many programs log everything to stderr (Python, Postgres), so it is marked, not alarmed. */
      .line.err { border-left-color: var(--orca-border); }
      .line.lvl-warn { border-left-color: var(--warn); background: color-mix(in srgb, var(--warn) 9%, transparent); }
      .line.lvl-error { border-left-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, transparent); }
      .ts { color: var(--orca-muted-foreground); user-select: none; }
      .level-word { font-weight: 600; }
      .log-link { text-decoration: underline dotted; text-underline-offset: 2px; cursor: pointer; }
      .log-link:hover, .log-link:focus-visible { text-decoration-style: solid; color: var(--orca-primary); }
      .level-word.debug { color: var(--orca-muted-foreground); }
      .level-word.info { color: var(--ansi-2); }
      .level-word.warn { color: var(--ansi-3); }
      .level-word.error { color: var(--ansi-1); }
      .src { font-weight: 600; }
      .trace { display: block; margin-left: 12px; }
      .trace summary { color: var(--orca-muted-foreground); cursor: pointer; white-space: normal; }
      .trace-project { background: color-mix(in srgb, var(--orca-primary) 12%, transparent); }
      .trace-library { opacity: .65; }
      .service-select { margin-left: 6px; flex: 0 0 auto; }
      #events-list { max-height: 160px; overflow: auto; }
      .event { display: flex; gap: 6px; align-items: baseline; margin: 4px 0; }
      .event .link { text-align: left; white-space: normal; }
      #view-name { min-width: 50px; flex: 1; }
      .placeholder { padding: 4px 8px; color: var(--orca-muted-foreground); font-family: system-ui, sans-serif; white-space: normal; }
      .b { font-weight: 700; } .d { opacity: 0.7; } .i { font-style: italic; } .u { text-decoration: underline; }
      .f0 { color: var(--ansi-0); } .f1 { color: var(--ansi-1); } .f2 { color: var(--ansi-2); } .f3 { color: var(--ansi-3); }
      .f4 { color: var(--ansi-4); } .f5 { color: var(--ansi-5); } .f6 { color: var(--ansi-6); } .f7 { color: var(--ansi-7); }
      .f8 { color: var(--ansi-8); } .f9 { color: var(--ansi-9); } .f10 { color: var(--ansi-10); } .f11 { color: var(--ansi-11); }
      .f12 { color: var(--ansi-12); } .f13 { color: var(--ansi-13); } .f14 { color: var(--ansi-14); } .f15 { color: var(--ansi-15); }
      .k0 { background: var(--ansi-0); } .k1 { background: var(--ansi-1); } .k2 { background: var(--ansi-2); } .k3 { background: var(--ansi-3); }
      .k4 { background: var(--ansi-4); } .k5 { background: var(--ansi-5); } .k6 { background: var(--ansi-6); } .k7 { background: var(--ansi-7); }
      .k8 { background: var(--ansi-8); } .k9 { background: var(--ansi-9); } .k10 { background: var(--ansi-10); } .k11 { background: var(--ansi-11); }
      .k12 { background: var(--ansi-12); } .k13 { background: var(--ansi-13); } .k14 { background: var(--ansi-14); } .k15 { background: var(--ansi-15); }
    </style>
  </head>
  <body>
    <header class="toolbar">
      <div class="toolbar-row">
        <select id="workspace" aria-label="Project"></select>
        <button id="refresh" class="square" title="Refresh" aria-label="Refresh"></button>
      </div>
      <div class="project-actions" role="group" aria-label="Whole project">
        <button id="project-up" title="docker compose up -d, in a terminal" disabled>Up</button>
        <button id="project-restart" title="docker compose restart" disabled>Restart</button>
        <button id="project-down" title="docker compose down: stops and removes the containers" disabled>Down</button>
      </div>
      <div id="docker-context" class="docker-context">Docker: loading…</div>
      <details id="compose-settings" class="compose-settings">
        <summary>Compose settings</summary>
        <form id="compose-form">
          <label>Compose files (one per line, relative to this workspace)
            <textarea id="compose-files" placeholder="Automatic discovery, or e.g. infra/stack.yml"></textarea>
          </label>
          <label>Profiles for Up (comma-separated)
            <input id="compose-profiles" placeholder="Compose defaults, or e.g. web, tools" />
          </label>
          <span id="available-profiles" class="hint"></span>
          <div class="row"><button id="compose-apply" type="submit" disabled>Apply</button><button id="compose-defaults" type="button">Use defaults</button></div>
        </form>
      </details>
    </header>
    <div id="notice" class="notice" role="status" hidden></div>
    <details id="operations" class="activity" hidden>
      <summary><span id="operations-title">Recent operations</span></summary>
      <div id="operations-list"></div>
    </details>
    <details id="events" class="activity">
      <summary><span id="events-title">Container events</span></summary>
      <div id="events-list"></div>
    </details>
    <ul id="services" class="services" aria-label="Containers"></ul>
    <div id="services-resize" class="services-resize" tabindex="0" role="separator" aria-label="Resize service list" aria-orientation="horizontal" aria-valuemin="48" aria-valuemax="600" aria-valuenow="160"></div>
    <details id="diagnostics" class="diagnostics" hidden>
      <summary id="diagnostic-title">Container diagnostics</summary>
      <div id="diagnostic-body"></div>
    </details>
    <div class="logbar">
      <div class="row">
        <select id="saved-view" aria-label="Saved view"><option value="">Saved views…</option></select>
        <input id="view-name" placeholder="View name" aria-label="View name" maxlength="60" />
        <button id="view-save" disabled>Save view</button>
        <button id="view-delete" disabled>Delete</button>
      </div>
      <div class="row">
        <strong id="log-title" class="log-title">Logs</strong>
        <button id="ask" title="Start an agent with the lines shown and ask it to find the cause" disabled>Ask agent</button>
        <button id="copy" title="Copy selected log text, or all visible lines" disabled>Copy</button>
        <button id="save" class="square" title="Save the lines shown to a file" aria-label="Save log" disabled></button>
        <button id="clear" class="square" title="Hide everything logged so far" aria-label="Clear log" disabled></button>
      </div>
      <div class="row">
        <input id="filter" type="search" placeholder="Filter or trace_id=value" aria-label="Filter log lines" />
        <select id="level" aria-label="Level">
          <option value="all">All levels</option>
          <option value="warn">Warnings &amp; errors</option>
          <option value="error">Errors</option>
        </select>
        <select id="window" aria-label="Period">
          <option value="tail">Last 1000 lines</option>
          <option value="5m">Last 5 minutes</option>
          <option value="15m">Last 15 minutes</option>
          <option value="1h">Last hour</option>
          <option value="start">Since start</option>
          <option value="event" disabled>Around event (±30s)</option>
        </select>
        <button id="live" hidden>Live logs</button>
      </div>
      <div class="row">
        <input id="search" type="search" placeholder="Find in loaded logs" aria-label="Find in log" maxlength="512" />
        <span id="search-count" class="search-count" aria-live="polite"></span>
        <button id="search-previous" title="Previous match (Shift+Enter)" aria-label="Previous match" disabled>↑</button>
        <button id="search-next" title="Next match (Enter)" aria-label="Next match" disabled>↓</button>
        <button id="error-previous" title="Previous error (Alt+Up)" aria-label="Previous error" disabled>↑ Error</button>
        <button id="error-next" title="Next error (Alt+Down)" aria-label="Next error" disabled>↓ Error</button>
      </div>
      <div class="row">
        <label><input id="follow" type="checkbox" checked /> Follow</label>
        <label><input id="timestamps" type="checkbox" /> Time</label>
        <label><input id="wrap" type="checkbox" checked /> Wrap</label>
        <label><input id="group-errors" type="checkbox" /> Group errors</label>
        <label><input id="json-fields" type="checkbox" /> JSON fields</label>
      </div>
      <div id="cleared" class="cleared" hidden>
        <span id="cleared-text"></span>
        <button id="show-all" class="link">Show all</button>
      </div>
    </div>
    <div id="log" class="log wrap" tabindex="0" role="log" aria-label="Container log"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
